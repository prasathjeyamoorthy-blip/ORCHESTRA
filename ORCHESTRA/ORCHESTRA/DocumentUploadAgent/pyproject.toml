[project]
name = "documentuploadagent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "prasathjeyamoorthy-blip", email = "prasathjeyamoorthy@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.95.2",
    "uvicorn>=0.22.0",
    "python-multipart>=0.0.6",
    "pdf2image>=1.16.3",
    "pillow>=9.5.0",
    "requests>=2.31.0",
    "rapidfuzz>=2.15.1",
    "opencv-python>=4.8.1.78",
    "python-dotenv>=1.0.1",
    "flask>=2.2.5",
    "cryptography>=50.0.0",
]

[project.scripts]
documentuploadagent = "documentuploadagent:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"
