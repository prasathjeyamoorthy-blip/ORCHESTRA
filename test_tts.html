<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TTS Test</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
            background: #1a1a1a;
            color: #fff;
        }
        h1 { color: #4CAF50; }
        .test-section {
            background: #2a2a2a;
            padding: 20px;
            margin: 20px 0;
            border-radius: 8px;
            border: 1px solid #444;
        }
        button {
            background: #4CAF50;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            border-radius: 4px;
            cursor: pointer;
            margin: 5px;
        }
        button:hover { background: #45a049; }
        button:disabled {
            background: #666;
            cursor: not-allowed;
        }
        .status {
            padding: 10px;
            margin: 10px 0;
            border-radius: 4px;
            font-family: monospace;
        }
        .success { background: #1b5e20; border: 1px solid #4CAF50; }
        .error { background: #b71c1c; border: 1px solid #f44336; }
        .info { background: #01579b; border: 1px solid #2196F3; }
        input, select, textarea {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            background: #333;
            border: 1px solid #555;
            color: #fff;
            border-radius: 4px;
            font-size: 14px;
        }
        label {
            display: block;
            margin-top: 10px;
            color: #aaa;
        }
    </style>
</head>
<body>
    <h1>🎤 Voice Agent TTS Test</h1>
    <p>Direct test of the TTS endpoint without frontend interference</p>

    <div class="test-section">
        <h2>Test Configuration</h2>
        <label>Text to Speak:</label>
        <textarea id="testText" rows="3">Hello! This is a test of the NVIDIA TTS system. Can you hear me?</textarea>
        
        <label>Language:</label>
        <select id="language">
            <option value="en">English</option>
            <option value="ta">Tamil (தமிழ்)</option>
            <option value="hi">Hindi (हिंदी)</option>
        </select>

        <label>TTS Endpoint URL:</label>
        <input type="text" id="endpoint" value="http://localhost:8002/api/voice/tts">

        <button onclick="testTTS()">🔊 Test TTS</button>
        <button onclick="checkHealth()">🏥 Check Health</button>
        <button onclick="clearLogs()">🧹 Clear Logs</button>
    </div>

    <div class="test-section">
        <h2>Test Results</h2>
        <div id="status"></div>
    </div>

    <div class="test-section">
        <h2>Audio Player</h2>
        <audio id="audioPlayer" controls style="width: 100%;"></audio>
    </div>

    <script>
        const status = document.getElementById('status');
        const audioPlayer = document.getElementById('audioPlayer');

        function log(message, type = 'info') {
            const div = document.createElement('div');
            div.className = `status ${type}`;
            div.innerHTML = `[${new Date().toLocaleTimeString()}] ${message}`;
            status.appendChild(div);
            status.scrollTop = status.scrollHeight;
        }

        function clearLogs() {
            status.innerHTML = '';
            log('Logs cleared', 'info');
        }

        async function checkHealth() {
            log('Checking voice agent health...', 'info');
            try {
                const res = await fetch('http://localhost:8002/api/health');
                if (res.ok) {
                    const data = await res.json();
                    log(`✅ Health check passed: ${JSON.stringify(data)}`, 'success');
                } else {
                    log(`❌ Health check failed: ${res.status} ${res.statusText}`, 'error');
                    if (res.status === 404) {
                        log('Wrong voice server is running! Run: fix_voice_server.bat', 'error');
                    }
                }
            } catch (err) {
                log(`❌ Connection failed: ${err.message}`, 'error');
                log('Is the voice agent running on port 8002?', 'error');
            }
        }

        async function testTTS() {
            const text = document.getElementById('testText').value.trim();
            const language = document.getElementById('language').value;
            const endpoint = document.getElementById('endpoint').value;

            if (!text) {
                log('❌ Please enter some text', 'error');
                return;
            }

            log(`Testing TTS with language: ${language}`, 'info');
            log(`Text: "${text.substring(0, 50)}${text.length > 50 ? '...' : ''}"`, 'info');

            try {
                const form = new FormData();
                form.append('text', text);
                form.append('language', language);

                log('Sending request to TTS endpoint...', 'info');
                const res = await fetch(endpoint, {
                    method: 'POST',
                    body: form
                });

                log(`Response status: ${res.status} ${res.statusText}`, 
                    res.ok ? 'success' : 'error');

                if (!res.ok) {
                    const errorText = await res.text();
                    log(`❌ TTS failed: ${errorText}`, 'error');
                    
                    if (res.status === 404) {
                        log('❌ TTS endpoint not found - WRONG server running!', 'error');
                        log('Run: fix_voice_server.bat to switch servers', 'error');
                    } else if (res.status === 503) {
                        log('❌ NVIDIA API error - check API keys in pan-rag/.env', 'error');
                    }
                    return;
                }

                const blob = await res.blob();
                log(`✅ Received audio: ${blob.size} bytes`, 'success');

                if (blob.size < 100) {
                    log('⚠️ Audio file is very small - might be empty', 'error');
                    return;
                }

                const url = URL.createObjectURL(blob);
                audioPlayer.src = url;
                audioPlayer.onended = () => URL.revokeObjectURL(url);
                
                log('▶️ Playing audio...', 'success');
                try {
                    await audioPlayer.play();
                    log('✅ Audio playback started!', 'success');
                } catch (playErr) {
                    log(`❌ Audio playback failed: ${playErr.message}`, 'error');
                    log('Check browser autoplay settings or volume', 'error');
                }

            } catch (err) {
                log(`❌ Request failed: ${err.message}`, 'error');
                log('Is the voice agent running?', 'error');
            }
        }

        // Auto-check health on page load
        window.onload = () => {
            log('Voice Agent TTS Test Tool loaded', 'success');
            log('Click "Check Health" to verify voice agent is running', 'info');
            checkHealth();
        };
    </script>
</body>
</html>
