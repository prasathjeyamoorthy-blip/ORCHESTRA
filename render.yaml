services:

  # ── ORCHESTRA Main Backend (Chat + Playwright automation) ─────────────────
  - type: web
    name: residence-certificate-orchestra
    runtime: python
    region: singapore
    rootDir: ORCHESTRA/ORCHESTRA/ORCHESTRA
    buildCommand: "pip install -r requirements.txt && python -m playwright install chromium --with-deps"
    startCommand: "uvicorn app:app --host 0.0.0.0 --port $PORT"
    plan: free
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: OPEN_ROUTER_API_KEY
        sync: false
      - key: QDRANT_URL
        sync: false
      - key: QDRANT_API_KEY
        sync: false
      - key: NVIDIA_API_KEY
        sync: false
      - key: NVIDIA_META_11B
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_API_KEY1
        sync: false
      - key: GROQ_API_KEY2
        sync: false
      - key: GROQ_API_KEY3
        sync: false
      - key: GROQ_API_KEY4
        sync: false
      - key: GROQ_API_KEY5
        sync: false
      - key: GROQ_API_KEY6
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: UPSTASH_REDIS_REST_URL
        sync: false
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false
      - key: MESSAGE_CENTRAL_AUTH_TOKEN
        sync: false
      - key: MESSAGE_CENTRAL_CUSTOMER_ID
        sync: false
      - key: ENCRYPTION_SECRET_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        value: "https://residence-certificate-frontend.onrender.com,http://localhost:5173,http://localhost:3000"

  # ── Document Upload Agent (VLM extraction + face validation) ─────────────
  - type: web
    name: residence-certificate-document-upload
    runtime: python
    region: singapore
    rootDir: ORCHESTRA/ORCHESTRA/DocumentUploadAgent
    buildCommand: "pip install -r requirements.txt && apt-get install -y poppler-utils || true"
    startCommand: "uvicorn app:app --host 0.0.0.0 --port $PORT"
    plan: free
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: NVIDIA_API_KEY
        sync: false
      - key: NVIDIA_META_11B
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_API_KEY1
        sync: false
      - key: GROQ_API_KEY2
        sync: false
      - key: GROQ_API_KEY3
        sync: false
      - key: GROQ_API_KEY4
        sync: false
      - key: GROQ_API_KEY5
        sync: false
      - key: GROQ_API_KEY6
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: ENCRYPTION_SECRET_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        value: "https://residence-certificate-frontend.onrender.com,http://localhost:5173,http://localhost:3000"

  # ── Frontend (React + Vite) ───────────────────────────────────────────────
  - type: web
    name: residence-certificate-frontend
    runtime: static
    region: singapore
    rootDir: ORCHESTRA/frontend
    buildCommand: "npm install && npm run build"
    staticPublishPath: dist
    pullRequestPreviewsEnabled: false
    envVars:
      - key: VITE_API_BASE
        value: "https://residence-certificate-orchestra.onrender.com"
      - key: VITE_DOC_API_BASE
        value: "https://residence-certificate-document-upload.onrender.com"
      - key: VITE_WS_BASE
        value: "wss://residence-certificate-orchestra.onrender.com"
    headers:
      - path: /*
        name: Cache-Control
        value: no-cache
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
